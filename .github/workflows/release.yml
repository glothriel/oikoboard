# Every merge to master is a release: a date tag (v2026.11.23.1, then .2, ... the same day), the server
# image and compose artifact as :<version> and :latest (image.yml; production follows :latest), and a
# GitHub release with the Android APK. Pushing a v* tag by hand releases that tag the same way.
name: Release

on:
  push:
    branches: [master]
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.50.0 # same as image.yml

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tag
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
          elif tag=$(git tag --points-at "$GITHUB_SHA" 'v*' | head -1) && [ -n "$tag" ]; then
            : # a re-run: the commit is tagged already
          else
            day=v$(date -u +%Y.%m.%d)
            n=$(git tag -l "$day.*" | sed "s/^$day\.//" | sort -n | tail -1)
            tag=$day.$(( ${n:-0} + 1 ))
            git tag "$tag" "$GITHUB_SHA"
            # pushed with GITHUB_TOKEN, so it does not start this workflow again
            git push origin "refs/tags/$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "### $tag" >> "$GITHUB_STEP_SUMMARY"

  image:
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.version.outputs.tag }}
      tags: ${{ needs.version.outputs.tag }} latest

  apk:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Release keystore
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$ANDROID_KEYSTORE" ]; then
            printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE not set — the APK is signed with a debug key"
          fi
      - name: Build
        working-directory: app
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-name="${TAG#v}" --build-number="${{ github.run_number }}"
          mv build/app/outputs/flutter-apk/app-release.apk "oikoboard-${TAG}.apk"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" "app/oikoboard-${TAG}.apk" --generate-notes --verify-tag
