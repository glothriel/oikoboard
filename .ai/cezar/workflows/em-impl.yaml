version: 2
name: em-impl
description: Implement the approved plan task by task; per task a developer and a reviewer argue with memory until approve. Scripts in .ai/cezar/em/.
nodes:
  - { id: start, type: start }
  - { id: tasks, type: loop, name: Task fuse, max: 30 }
  - { id: next, type: check, name: Next task, command: "bash .ai/cezar/em/next-task.sh" }

  # first attempt of a task
  - id: implement
    type: agent
    name: Developer
    prompt: |
      You are the DEVELOPER on one task of a plan. Read `.ai/cezar/em/state/current-task.md` (the task),
      and the spec and full task list it points to. Implement exactly this task, with tests for
      new logic. Run `bash .ai/cezar/em/verify.sh` before you finish. Do not push, do not comment on GitHub: the workflow does that.
  - { id: tests, type: check, name: Verify, command: "bash .ai/cezar/em/verify.sh" }
  - { id: fixes, type: loop, name: Fix fuse, max: 10 }
  - id: fix
    type: agent
    name: Developer fixes verify
    session: { continue: implement }
    prompt: |
      `bash .ai/cezar/em/verify.sh` failed:

      {{nodes.tests.output}}

      Fix the cause, not the tests.

  - id: review
    type: agent
    name: Reviewer
    verdicts: [approve, changes]
    prompt: |
      You are the REVIEWER of one task of a plan. Read `.ai/cezar/em/state/current-task.md`, the spec and the
      task list it points to, then the task's change: `git diff $(cat .ai/cezar/em/state/base)`.
      Apply `CODE_REVIEW.md`. Report only real problems: wrong behaviour, a missed acceptance criterion, broken contract,
      missing tests for new logic, needless complexity. No style nits, no speculative edge cases.
      Write your findings to `.ai/cezar/em/state/review.md` (numbered, each with file:line), or the single
      line "No findings." Do not edit any other file.

  # changes requested: developer answers in the same session, reviewer re-reviews in its own
  - { id: post-review, type: check, name: Post review, command: "bash .ai/cezar/em/post-comment.sh reviewer .ai/cezar/em/state/review.md" }
  - { id: guard, type: check, name: Round guard, command: "bash .ai/cezar/em/round-guard.sh" }
  - { id: rounds, type: loop, name: Review fuse, max: 30 }
  - id: address
    type: agent
    name: Developer answers review
    session: { continue: implement }
    prompt: |
      The reviewer asked for changes (full text in `.ai/cezar/em/state/review.md`):

      For each finding either fix it or explain why it is wrong or not worth it. Write your
      answer per finding to `.ai/cezar/em/state/reply.md`. Run `bash .ai/cezar/em/verify.sh` before you
      finish. 
  - { id: tests-a, type: check, name: Verify, command: "bash .ai/cezar/em/verify.sh" }
  - { id: fixes-a, type: loop, name: Fix fuse, max: 10 }
  - id: fix-a
    type: agent
    name: Developer fixes verify
    session: { continue: implement }
    prompt: |
      `bash .ai/cezar/em/verify.sh` failed:

      {{nodes.tests-a.output}}

      Fix the cause, not the tests.
  - { id: post-reply, type: check, name: Post reply, command: "bash .ai/cezar/em/post-comment.sh developer .ai/cezar/em/state/reply.md" }
  - id: rereview
    type: agent
    name: Reviewer re-reviews
    verdicts: [approve, changes]
    session: { continue: review }
    prompt: |
      The developer answered your findings in `.ai/cezar/em/state/reply.md` and changed the code
      (`git diff $(cat .ai/cezar/em/state/base)` is the whole task so far). Accept a justification
      when it is sound; insist only on what still matters. Rewrite `.ai/cezar/em/state/review.md` with
      what is still open, or the single line "No findings."

  - { id: done-task, type: check, name: Task approved, command: "bash .ai/cezar/em/mark-done.sh" }
  - { id: escalate, type: check, name: Escalate, command: "bash .ai/cezar/em/escalate.sh" }
  - { id: all-done, type: end, status: success }
  - { id: stuck, type: end, status: failed }

edges:
  - { from: start, to: tasks }
  - { from: tasks.repeat, to: next }
  - { from: tasks.exhausted, to: stuck }
  - { from: next.pass, to: implement }
  - { from: next.fail, to: all-done }

  - { from: implement.done, to: tests }
  - { from: tests.pass, to: review }
  - { from: tests.fail, to: fixes }
  - { from: fixes.repeat, to: fix }
  - { from: fixes.exhausted, to: escalate }
  - { from: fix.done, to: tests }

  - { from: review.approve, to: done-task }
  - { from: review.changes, to: post-review }
  - { from: post-review.pass, to: guard }
  - { from: guard.pass, to: rounds }
  - { from: guard.fail, to: escalate }
  - { from: rounds.repeat, to: address }
  - { from: rounds.exhausted, to: escalate }

  - { from: address.done, to: tests-a }
  - { from: tests-a.pass, to: post-reply }
  - { from: tests-a.fail, to: fixes-a }
  - { from: fixes-a.repeat, to: fix-a }
  - { from: fixes-a.exhausted, to: escalate }
  - { from: fix-a.done, to: tests-a }
  - { from: post-reply.pass, to: rereview }
  - { from: rereview.approve, to: done-task }
  - { from: rereview.changes, to: post-review }

  - { from: done-task.pass, to: tasks }
  - { from: escalate.pass, to: stuck }
