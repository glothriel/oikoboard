version: 2
name: em-plan
description: From a labelled issue to a reviewed plan PR (intent, then spec + tasks). Open product questions go to the human on the issue first; the planner and the plan reviewer argue with memory; a human reviews the result. Scripts in .ai/cezar/em/.
nodes:
  - { id: start, type: start }
  - { id: init, type: check, name: Read issue, command: "bash .ai/cezar/em/plan-init.sh" }
  # intent first: open product questions go to the human on the issue, the run stops until answered
  - id: intent
    type: agent
    name: Intent
    verdicts: [clear, questions]
    prompt: |
      You are the PLANNER. {{task}}
      First settle the intent, following `.ai/cezar/em/intent.md`. Write no spec or plan yet.
  - { id: ask-intent, type: check, name: Ask about the intent, command: "bash .ai/cezar/em/ask-issue.sh intent" }
  - { id: post-intent, type: check, name: Post intent, command: "bash .ai/cezar/em/intent-post.sh" }
  - id: planner
    type: agent
    name: Planner
    verdicts: [ready, questions]
    session: { continue: intent }
    prompt: |
      The intent is settled (`.ai/cezar/em/state/intent.md`). Now write the spec and the tasks for it,
      following `.ai/cezar/em/planner.md` and the repository rules in `.ai/cezar/em/rules.md`.
      If a technical question still blocks the plan, write the numbered questions to
      `.ai/cezar/em/state/questions.md`, write no plan, and end with verdict questions. Otherwise end
      with verdict ready.
  - { id: ask, type: check, name: Ask on the issue, command: "bash .ai/cezar/em/ask-issue.sh plan" }

  - { id: validate, type: check, name: Validate plan, command: "bash .ai/cezar/em/validate-plan.sh" }
  - { id: vloop, type: loop, name: Format fixes, max: 3 }
  - id: replan
    type: agent
    name: Planner fixes format
    session: { continue: planner }
    prompt: |
      `bash .ai/cezar/em/validate-plan.sh` found problems:

      {{nodes.validate.output}}

      Fix the plan files.
  - { id: open, type: check, name: Open plan PR, command: "bash .ai/cezar/em/open-pr.sh" }

  # UI mockups: a designer prototypes the views the plan changes; screenshots go to the plan PR, the
  # prototype code is kept on em-mockups/issue-<n> and the planner points the UI tasks at it
  - { id: ui-plan, type: check, name: "UI in the plan?", command: "bash .ai/cezar/em/screens-check.sh plan" }
  - { id: needs-mockups, type: if, name: "Mockups needed?", condition: { kind: output, ref: ui-plan.output, op: contains, value: needed } }
  - { id: mock-base, type: check, name: Remember plan commit, command: "git rev-parse HEAD > .ai/cezar/em/state/mock-base" }
  - id: designer
    type: agent
    name: Designer
    prompt: |
      You are the DESIGNER. {{task}}
      The plan is the spec and the tasks this branch adds (`git diff --name-only origin/master...HEAD -- .ai/specs`).
      Follow `.claude/skills/ui-mockups/SKILL.md` and the repository rules in `.ai/cezar/em/rules.md`: prototype every view the
      plan adds or changes (the spec's `## UI` section), screenshot each one on the mock backend and leave
      the final PNGs and `captions.md` in `.ai/cezar/em/state/screens/`. Do not change the plan files.
      Your prototype is kept on a side branch as the reference the developers reuse, so build it with
      the app's real widgets, theme and l10n, in the files where the plan puts these views.
  - { id: mock-publish, type: check, name: Post mockups, command: "bash .ai/cezar/em/screens-publish.sh designer" }
  - { id: mloop, type: loop, name: Mockup retries, max: 2 }
  - id: designer-again
    type: agent
    name: Designer retries
    session: { continue: designer }
    prompt: |
      Publishing failed:

      {{nodes.mock-publish.output}}

      Leave the final screenshots in `.ai/cezar/em/state/screens/`.
  - { id: mock-save, type: check, name: Keep prototype on a branch, command: "bash .ai/cezar/em/mock-save.sh" }
  - id: mock-plan
    type: agent
    name: Planner points tasks at mockups
    session: { continue: planner }
    prompt: |
      The designer prototyped the views of your plan:

      {{nodes.mock-save.output}}

      If a prototype was kept, the developers should reuse it. Read it (`git fetch -q origin <branch>`,
      then `git diff HEAD origin/<branch>`) and add to every task that builds one of these views one
      bullet: "- Mockup: reuse <files / widgets> from branch <branch> (git show origin/<branch>:<path>);
      match its look, adapt the code to this task." In the spec's
      `## UI` section add one line naming the branch. Change nothing else in the plan.
  - { id: validate-m, type: check, name: Validate plan, command: "bash .ai/cezar/em/validate-plan.sh" }
  - { id: vloop-m, type: loop, name: Format fixes, max: 3 }
  - id: mfix
    type: agent
    name: Planner fixes format
    session: { continue: planner }
    prompt: |
      `bash .ai/cezar/em/validate-plan.sh` found problems:

      {{nodes.validate-m.output}}

      Fix the plan files.
  - { id: push-m, type: check, name: Push plan, command: "bash .ai/cezar/em/push.sh" }

  - id: preview
    type: agent
    name: Plan reviewer
    verdicts: [approve, changes]
    prompt: |
      You are the PLAN REVIEWER. {{task}}
      The issue is in `.ai/cezar/em/state/issue.md`; the plan is the spec and the tasks this branch adds
      (`git diff --name-only origin/master...HEAD -- .ai/specs`); the rules it must follow are in
      `.ai/cezar/em/planner.md` and `.ai/cezar/em/rules.md`. The agreed intent is in
      `.ai/cezar/em/state/intent.md`. Check it against the actual code: requirements of the issue it misses,
      wrong paths, types or patterns, tasks that would not build or pass on their own, missed reuse of
      existing code, over-engineering. Do not re-decide product choices under "Decisions and why" unless
      they contradict the issue. Write your findings to `.ai/cezar/em/state/review.md` (numbered), or the
      single line "No findings." Do not edit any other file.
  - { id: post-review, type: check, name: Post review, command: "bash .ai/cezar/em/post-comment.sh reviewer .ai/cezar/em/state/review.md" }
  - { id: guard, type: check, name: Round guard, command: "bash .ai/cezar/em/round-guard.sh" }
  - { id: rounds, type: loop, name: Review fuse, max: 30 }
  - id: paddress
    type: agent
    name: Planner answers review
    session: { continue: planner }
    prompt: |
      The plan reviewer asked for changes (full text in `.ai/cezar/em/state/review.md`). For each point
      either change the plan or explain why not. Write your answer per point to
      `.ai/cezar/em/state/answer.md`. Commit nothing.
  - { id: validate-a, type: check, name: Validate plan, command: "bash .ai/cezar/em/validate-plan.sh" }
  - { id: vloop-a, type: loop, name: Format fixes, max: 3 }
  - id: pfix
    type: agent
    name: Planner fixes format
    session: { continue: planner }
    prompt: |
      `bash .ai/cezar/em/validate-plan.sh` found problems:

      {{nodes.validate-a.output}}

      Fix the plan files.
  - { id: reply, type: check, name: Push + post answer, command: "bash .ai/cezar/em/push.sh && bash .ai/cezar/em/post-comment.sh planner .ai/cezar/em/state/answer.md" }
  - id: rereview
    type: agent
    name: Plan reviewer re-reviews
    verdicts: [approve, changes]
    session: { continue: preview }
    prompt: |
      The planner answered your points in `.ai/cezar/em/state/answer.md` and revised the plan. Accept a
      justification when it is sound; insist only on what still matters. Rewrite
      `.ai/cezar/em/state/review.md` with what is still open, or the single line "No findings."

  - { id: ready, type: check, name: Hand to human, command: "bash .ai/cezar/em/plan-ready.sh" }
  - { id: escalate, type: check, name: Escalate, command: "bash .ai/cezar/em/escalate.sh" }
  - { id: planned, type: end, name: Plan PR ready, status: success }
  - { id: asked, type: end, name: Questions asked, status: success }
  - { id: stuck, type: end, status: failed }

edges:
  - { from: start, to: init }
  - { from: init.pass, to: intent }
  - { from: intent.questions, to: ask-intent }
  - { from: ask-intent.pass, to: asked }
  - { from: intent.clear, to: post-intent }
  - { from: post-intent.pass, to: planner }
  - { from: planner.questions, to: ask }
  - { from: ask.pass, to: asked }
  - { from: planner.ready, to: validate }

  - { from: validate.fail, to: vloop }
  - { from: vloop.repeat, to: replan }
  - { from: vloop.exhausted, to: escalate }
  - { from: replan.done, to: validate }
  - { from: validate.pass, to: open }
  - { from: open.pass, to: ui-plan }
  - { from: ui-plan.pass, to: needs-mockups }
  - { from: needs-mockups.true, to: mock-base }
  - { from: needs-mockups.false, to: preview }
  - { from: mock-base.pass, to: designer }
  - { from: designer.done, to: mock-publish }
  - { from: mock-publish.pass, to: mock-save }
  - { from: mock-publish.fail, to: mloop }
  - { from: mloop.repeat, to: designer-again }
  - { from: mloop.exhausted, to: escalate }
  - { from: designer-again.done, to: mock-publish }
  - { from: mock-save.pass, to: mock-plan }
  - { from: mock-plan.done, to: validate-m }
  - { from: validate-m.fail, to: vloop-m }
  - { from: vloop-m.repeat, to: mfix }
  - { from: vloop-m.exhausted, to: escalate }
  - { from: mfix.done, to: validate-m }
  - { from: validate-m.pass, to: push-m }
  - { from: push-m.pass, to: preview }

  - { from: preview.approve, to: ready }
  - { from: preview.changes, to: post-review }
  - { from: post-review.pass, to: guard }
  - { from: guard.pass, to: rounds }
  - { from: guard.fail, to: escalate }
  - { from: rounds.repeat, to: paddress }
  - { from: rounds.exhausted, to: escalate }
  - { from: paddress.done, to: validate-a }
  - { from: validate-a.fail, to: vloop-a }
  - { from: vloop-a.repeat, to: pfix }
  - { from: vloop-a.exhausted, to: escalate }
  - { from: pfix.done, to: validate-a }
  - { from: validate-a.pass, to: reply }
  - { from: reply.pass, to: rereview }
  - { from: rereview.approve, to: ready }
  - { from: rereview.changes, to: post-review }

  - { from: ready.pass, to: planned }
  - { from: escalate.pass, to: stuck }
