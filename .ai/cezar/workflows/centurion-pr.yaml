      {{nodes.mock-publish.output}}

      Leave the final screenshots in `.ai/cezar/centurion/state/screens/`.
  - { id: mock-save, type: check, name: Keep prototype on a branch, command: python3 .ai/cezar/centurion/state/runtime/run.py mock-save }
  - id: mock-plan
    type: agent
    name: Planner points tasks at mockups
    session: { continue: replanner }
    prompt: |
      The designer reworked the prototype for your revised plan:

      {{nodes.mock-save.output}}

      If a prototype was kept, the developers should reuse it. Read it (`git fetch -q origin <branch>`,
      then `git diff HEAD origin/<branch>`) and make sure every task that builds one of these views has
      one up-to-date short bullet: "- Mockup: `<branch>` — <which files / widgets to reuse>", and the spec's
      `## UI` section names the branch. Change nothing else in the plan.
  - { id: validate-m, type: check, name: Validate plan, command: python3 .ai/cezar/centurion/state/runtime/run.py validate-plan }
  - { id: vloop-m, type: loop, name: Format fixes, max: 3 }
  - id: mfix
    type: agent
    name: Planner fixes format
    session: { continue: replanner }
    prompt: |
      `python3 .ai/cezar/centurion/state/runtime/run.py validate-plan` found problems:

      {{nodes.validate-m.output}}

      Fix the plan files.
  - { id: answered, type: check, name: Push + answer, command: python3 .ai/cezar/centurion/state/runtime/run.py plan-answered }
  - { id: escalate, type: check, name: Escalate, command: python3 .ai/cezar/centurion/state/runtime/run.py escalate }
  - { id: skipped, type: end, name: Nothing to do, status: success }
  - { id: done, type: end, status: success }
  - { id: stuck, type: end, status: failed }
