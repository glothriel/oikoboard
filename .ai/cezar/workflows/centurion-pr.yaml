version: 2
name: centurion-pr
description: "Reacts to a human review on a centurion PR. Plan PR approved: merge it into the feature branch and implement task by task, one PR per task into the feature branch, then open the final PR. Plan reviewed: the planner revises. Final PR reviewed: the review becomes a task. Label resume on the issue: back into the task loop. Generated by centurion."
nodes:
  - { id: start, type: start }
  - { id: gate, type: check, name: Read review, command: python3 .ai/cezar/centurion/run.py review-gate }
  - { id: is-resume, type: if, name: "Resume?", condition: { kind: output, ref: gate.output, op: contains, value: resume } }
  - { id: is-approve, type: if, name: "Plan approved?", condition: { kind: output, ref: gate.output, op: contains, value: approve-plan } }
  - { id: is-impl, type: if, name: "Final PR reviewed?", condition: { kind: output, ref: gate.output, op: contains, value: changes-final } }
  - { id: is-plan, type: if, name: "Plan reviewed?", condition: { kind: output, ref: gate.output, op: contains, value: changes-plan } }
  - { id: start-impl, type: check, name: Start implementation, command: python3 .ai/cezar/centurion/state/runtime/run.py start-impl }
  - { id: add-task, type: check, name: Review becomes a task, command: python3 .ai/cezar/centurion/state/runtime/run.py add-review-task }
  # ---- task loop: one task at a time, developer and reviewer keep their sessions within a task
  - { id: tasks, type: loop, name: Task fuse, max: 30 }
  # the feature branch takes in the main branch before every task and before the final PR
  - { id: sync, type: check, name: Merge main branch, command: python3 .ai/cezar/centurion/state/runtime/run.py sync-main }
  - { id: is-synced, type: if, name: "Up to date?", condition: { kind: output, ref: sync.output, op: contains, value: up-to-date } }
  - { id: sync-verify, type: check, name: Check merge, command: python3 .ai/cezar/centurion/state/runtime/run.py sync-check }
  - { id: syncloop, type: loop, name: Merge fixes, max: 5 }
  - id: resolve
    type: agent
    name: Developer resolves merge
    prompt: |
      You are the DEVELOPER. Merging the main branch into this issue's feature branch needs you.
      `.ai/cezar/centurion/state/conflicts.md` lists the conflicted files and what each side did; follow
      `.ai/cezar/centurion/state/runtime/centurion/prompts/developer.md` and the repository rules in `.ai/cezar/centurion/state/runtime/rules.md`. The check after the merge said:

      {{nodes.sync-verify.output}}

      Resolve every conflict in the work tree so that both sides' changes keep working: the main
      branch is already released, so adapt the feature branch's side. Then run `python3 .ai/cezar/centurion/state/runtime/run.py sync-check`
      (conflict markers and the validation commands) and fix what it reports. Do not commit, push or
      comment: the workflow does that.
  - { id: sync-push, type: check, name: Push merge, command: python3 .ai/cezar/centurion/state/runtime/run.py sync-push }
  - { id: next, type: check, name: Next task, command: python3 .ai/cezar/centurion/state/runtime/run.py next-task }
  - { id: no-task, type: if, name: "All done?", condition: { kind: output, ref: next.output, op: contains, value: NONE } }
  - id: implement
    type: agent
    name: Developer
    prompt: |
      You are the DEVELOPER on one task of a plan. Follow `.ai/cezar/centurion/state/runtime/centurion/prompts/developer.md` and the repository
      rules in `.ai/cezar/centurion/state/runtime/rules.md`. The task is in `.ai/cezar/centurion/state/current-task.md`.
  - { id: tests, type: check, name: Verify, command: python3 .ai/cezar/centurion/state/runtime/run.py verify }
  - { id: task-pr, type: check, name: Open task PR, command: python3 .ai/cezar/centurion/state/runtime/run.py task-pr }
  # a task that touches the UI shows every view it changed before review
  - { id: ui-task, type: check, name: "UI changed?", command: python3 .ai/cezar/centurion/state/runtime/run.py screens-check task }
  - { id: needs-shots, type: if, name: "Screenshots needed?", condition: { kind: output, ref: ui-task.output, op: contains, value: needed } }
  - id: shoot
    type: agent
    name: Developer screenshots
    session: { continue: implement }
    prompt: |
      This task changed the app's UI. Following `.ai/cezar/centurion/state/runtime/centurion/prompts/screenshots.md` and the repository rules,
      screenshot every view it added or changed, in each state that matters, and leave the final PNGs
      and `captions.md` in `.ai/cezar/centurion/state/screens/`. Do not change code for the screenshots.
  - { id: shots-publish, type: check, name: Post screenshots, command: python3 .ai/cezar/centurion/state/runtime/run.py screens-publish developer }
  - { id: sloop, type: loop, name: Screenshot retries, max: 2 }
  - id: shoot-again
    type: agent
    name: Developer retries screenshots
    session: { continue: implement }
    prompt: |
      Publishing the screenshots failed:

      {{nodes.shots-publish.output}}

      Leave the final screenshots in `.ai/cezar/centurion/state/screens/`.
  - { id: fixes, type: loop, name: Fix fuse, max: 10 }
  - id: fix
    type: agent
    name: Developer fixes verify
    session: { continue: implement }
    prompt: |
      `python3 .ai/cezar/centurion/state/runtime/run.py verify` failed:

      {{nodes.tests.output}}

      Fix the cause, not the tests.
  - id: review
    type: agent
    name: Reviewer
    verdicts: [approve, changes]
    prompt: |
      You are the REVIEWER of one task of a plan. Follow `.ai/cezar/centurion/state/runtime/centurion/prompts/reviewer.md` and the repository rules
      in `.ai/cezar/centurion/state/runtime/rules.md`. The task is in `.ai/cezar/centurion/state/current-task.md`; its change is `python3 .ai/cezar/centurion/state/runtime/run.py task-diff`.
  - { id: post-review, type: check, name: Post review, command: python3 .ai/cezar/centurion/state/runtime/run.py post-comment reviewer review.md }
  - { id: guard, type: check, name: Round guard, command: python3 .ai/cezar/centurion/state/runtime/run.py round-guard }
  - { id: rounds, type: loop, name: Review fuse, max: 30 }
  - id: address
    type: agent
    name: Developer answers review
    session: { continue: implement }
    prompt: |
      The reviewer asked for changes (full text in `.ai/cezar/centurion/state/review.md`). For each finding
      either fix it or explain why it is wrong or not worth it. Write your answer per finding to
      `.ai/cezar/centurion/state/reply.md`. If you changed a view, take its screenshot again into
      `.ai/cezar/centurion/state/screens/` (`.ai/cezar/centurion/state/runtime/centurion/prompts/screenshots.md`). Run `python3 .ai/cezar/centurion/state/runtime/run.py verify`
      before you finish.
  - { id: tests-a, type: check, name: Verify, command: python3 .ai/cezar/centurion/state/runtime/run.py verify }
  - { id: fixes-a, type: loop, name: Fix fuse, max: 10 }
  - id: fix-a
    type: agent
    name: Developer fixes verify
    session: { continue: implement }
    prompt: |
      `python3 .ai/cezar/centurion/state/runtime/run.py verify` failed:

      {{nodes.tests-a.output}}

      Fix the cause, not the tests.
  - { id: post-reply, type: check, name: Push + post reply, command: python3 .ai/cezar/centurion/state/runtime/run.py task-reply }
  - id: rereview
    type: agent
    name: Reviewer re-reviews
    verdicts: [approve, changes]
    session: { continue: review }
    prompt: |
      The developer answered your findings in `.ai/cezar/centurion/state/reply.md` and changed the code
      (`python3 .ai/cezar/centurion/state/runtime/run.py task-diff` is the whole task so far). Accept a justification
      when it is sound; insist only on what still matters. Rewrite `.ai/cezar/centurion/state/review.md` with
      what is still open, or the single line "No findings."
  - { id: done-task, type: check, name: Task approved, command: python3 .ai/cezar/centurion/state/runtime/run.py mark-done }
  - { id: impl-ready, type: check, name: Open final PR, command: python3 .ai/cezar/centurion/state/runtime/run.py impl-ready }
  # ---- plan reviewed by a human: a fresh planner revises it
  - id: replanner
    type: agent
    name: Planner revises
    prompt: |
      You are the PLANNER. A human reviewed the plan on this PR; the review is in
      `.ai/cezar/centurion/state/human-review.md`. The plan is the spec and the tasks this branch adds
      (`python3 .ai/cezar/centurion/state/runtime/run.py plan-files`). Follow `.ai/cezar/centurion/state/runtime/centurion/prompts/planner.md` and the repository rules in `.ai/cezar/centurion/state/runtime/rules.md`.
      Change the plan or explain why not, for each point, and write your answer per point to
      `.ai/cezar/centurion/state/answer.md`. Commit nothing.
      If the review or your changes affect how the views of the plan look or behave (including comments
      on the mockups), write the single line `redo` to `.ai/cezar/centurion/state/mockups`: a designer then
      reworks the mockups.
  - { id: pvalidate, type: check, name: Validate plan, command: python3 .ai/cezar/centurion/state/runtime/run.py validate-plan }
  - { id: ploop, type: loop, name: Format fixes, max: 3 }
  - id: pfix
    type: agent
    name: Planner fixes format
    session: { continue: replanner }
    prompt: |
      `python3 .ai/cezar/centurion/state/runtime/run.py validate-plan` found problems:

      {{nodes.pvalidate.output}}

      Fix the plan files.
  # the revised plan changes the UI: the designer reworks the prototype, new mockups go to the PR
  - { id: remock, type: check, name: "Mockups to redo?", command: python3 .ai/cezar/centurion/state/runtime/run.py remock-check }
