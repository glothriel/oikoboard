  - { id: mock-restore, type: check, name: Restore prototype, command: python3 .ai/cezar/centurion/state/runtime/run.py mock-restore }
  - id: designer
    type: agent
    name: Designer
    prompt: |
      You are the DESIGNER. A human reviewed the plan on this PR (`.ai/cezar/centurion/state/human-review.md`)
      and the planner revised it (`.ai/cezar/centurion/state/answer.md`). The plan is the spec and the tasks
      this branch adds (`python3 .ai/cezar/centurion/state/runtime/run.py plan-files`). The previous prototype:

      {{nodes.mock-restore.output}}

      Follow `.ai/cezar/centurion/state/runtime/centurion/prompts/designer.md` and the repository rules in `.ai/cezar/centurion/state/runtime/rules.md`: rework the prototype so it
      shows every view of the revised plan (the spec's `## UI` section), screenshot each new or changed
      one and leave the final PNGs and `captions.md` (say what changed since the last mockups) in
      `.ai/cezar/centurion/state/screens/`. Do not change the plan files.
  - { id: mock-publish, type: check, name: Post mockups, command: python3 .ai/cezar/centurion/state/runtime/run.py screens-publish designer }
  - { id: mloop, type: loop, name: Mockup retries, max: 2 }
  - id: designer-again
    type: agent
    name: Designer retries
    session: { continue: designer }
    prompt: |
