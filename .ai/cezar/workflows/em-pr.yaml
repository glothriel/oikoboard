version: 2
name: em-pr
description: Reacts to a human review on an em PR. Plan PR approved, merge it into the feature branch and implement task by task, one PR per task into the feature branch, then open the final PR; plan reviewed, the planner revises; final PR reviewed, the review becomes a task; label resume on the issue, back into the task loop. Scripts in .ai/cezar/em/.
nodes:
  - { id: start, type: start }
  - { id: gate, type: check, name: Read review, command: "bash .ai/cezar/em/review-gate.sh" }
  - { id: is-resume, type: if, name: "Resume?", condition: { kind: output, ref: gate.output, op: contains, value: resume } }
  - { id: is-approve, type: if, name: "Plan approved?", condition: { kind: output, ref: gate.output, op: contains, value: approve-plan } }
  - { id: is-impl, type: if, name: "Final PR reviewed?", condition: { kind: output, ref: gate.output, op: contains, value: changes-final } }
  - { id: is-plan, type: if, name: "Plan reviewed?", condition: { kind: output, ref: gate.output, op: contains, value: changes-plan } }
  - { id: start-impl, type: check, name: Start implementation, command: "bash .ai/cezar/em/start-impl.sh" }
  - { id: add-task, type: check, name: Review becomes a task, command: "bash .ai/cezar/em/add-review-task.sh" }

  # ---- task loop: one task at a time, developer and reviewer keep their sessions within a task
  - { id: tasks, type: loop, name: Task fuse, max: 30 }
  - { id: next, type: check, name: Next task, command: "bash .ai/cezar/em/next-task.sh" }
  - { id: no-task, type: if, name: "All done?", condition: { kind: output, ref: next.output, op: contains, value: NONE } }
  - id: implement
    type: agent
    name: Developer
    prompt: |
      You are the DEVELOPER on one task of a plan. Read `.ai/cezar/em/state/current-task.md` (the task)
      and the spec and full task list it points to. Implement exactly this task, with tests for new
      logic, following the repository rules in `.ai/cezar/em/rules.md`. If the task has a "Mockup:"
      bullet, reuse that prototype (`git fetch -q origin <branch>`, `git show origin/<branch>:<path>`):
      same look, code adapted to the task. The plan fixes the design; the implementation details are
      yours. If the code shows a planned design is wrong, do it right and say why in your summary. Run `bash .ai/cezar/em/verify.sh` before you finish. Do not push and
      do not comment on GitHub: the workflow does that.
      If this is a review task (id R<n>), the human reviewer expects an answer: write one per point to
      `.ai/cezar/em/state/answer.md` (what you changed, or why not).
  - { id: tests, type: check, name: Verify, command: "bash .ai/cezar/em/verify.sh" }
  - { id: task-pr, type: check, name: Open task PR, command: "bash .ai/cezar/em/task-pr.sh" }
  # a task that touches the UI shows every view it changed before review
  - { id: ui-task, type: check, name: "UI changed?", command: "bash .ai/cezar/em/screens-check.sh task" }
  - { id: needs-shots, type: if, name: "Screenshots needed?", condition: { kind: output, ref: ui-task.output, op: contains, value: needed } }
  - id: shoot
    type: agent
    name: Developer screenshots
    session: { continue: implement }
    prompt: |
      This task changed the app's UI. Following `.claude/skills/ui-mockups/SKILL.md`, screenshot every
      view it added or changed on the mock backend, in each state that matters, and leave the final PNGs
      and `captions.md` in `.ai/cezar/em/state/screens/`. Do not change code for the screenshots.
  - { id: shots-publish, type: check, name: Post screenshots, command: "bash .ai/cezar/em/screens-publish.sh developer" }
  - { id: sloop, type: loop, name: Screenshot retries, max: 2 }
  - id: shoot-again
    type: agent
    name: Developer retries screenshots
    session: { continue: implement }
    prompt: |
      Publishing the screenshots failed:

      {{nodes.shots-publish.output}}

      Leave the final screenshots in `.ai/cezar/em/state/screens/`.
  - { id: fixes, type: loop, name: Fix fuse, max: 10 }
  - id: fix
    type: agent
    name: Developer fixes verify
    session: { continue: implement }
    prompt: |
      `bash .ai/cezar/em/verify.sh` failed:

      {{nodes.tests.output}}

      Fix the cause, not the tests.
  - id: review
    type: agent
    name: Reviewer
    verdicts: [approve, changes]
    prompt: |
      You are the REVIEWER of one task of a plan. Read `.ai/cezar/em/state/current-task.md`, the spec and
      the task list it points to, then the task's change: `git diff $(cat .ai/cezar/em/state/base)`.
      Apply `CODE_REVIEW.md` and `.ai/cezar/em/rules.md`. Review the code only; the screenshots are for
      the human. Report only real problems: wrong behaviour, a missed acceptance criterion,
      broken contract, missing tests for new logic, needless complexity. No style nits, no speculative
      edge cases. Write your findings to `.ai/cezar/em/state/review.md` (numbered, each with file:line),
      or the single line "No findings." Do not edit any other file.
  - { id: post-review, type: check, name: Post review, command: "bash .ai/cezar/em/post-comment.sh reviewer .ai/cezar/em/state/review.md" }
  - { id: guard, type: check, name: Round guard, command: "bash .ai/cezar/em/round-guard.sh" }
  - { id: rounds, type: loop, name: Review fuse, max: 30 }
  - id: address
    type: agent
    name: Developer answers review
    session: { continue: implement }
    prompt: |
      The reviewer asked for changes (full text in `.ai/cezar/em/state/review.md`). For each finding
      either fix it or explain why it is wrong or not worth it. Write your answer per finding to
      `.ai/cezar/em/state/reply.md`. If you changed a view, take its screenshot again into
      `.ai/cezar/em/state/screens/` (`.claude/skills/ui-mockups/SKILL.md`). Run `bash .ai/cezar/em/verify.sh`
      before you finish.
  - { id: tests-a, type: check, name: Verify, command: "bash .ai/cezar/em/verify.sh" }
  - { id: fixes-a, type: loop, name: Fix fuse, max: 10 }
  - id: fix-a
    type: agent
    name: Developer fixes verify
    session: { continue: implement }
    prompt: |
      `bash .ai/cezar/em/verify.sh` failed:

      {{nodes.tests-a.output}}

      Fix the cause, not the tests.
  - { id: post-reply, type: check, name: Push + post reply, command: "bash .ai/cezar/em/push.sh && bash .ai/cezar/em/post-comment.sh developer .ai/cezar/em/state/reply.md && bash .ai/cezar/em/screens-publish.sh developer --optional" }
  - id: rereview
    type: agent
    name: Reviewer re-reviews
    verdicts: [approve, changes]
    session: { continue: review }
    prompt: |
      The developer answered your findings in `.ai/cezar/em/state/reply.md` and changed the code
      (`git diff $(cat .ai/cezar/em/state/base)` is the whole task so far). Accept a justification
      when it is sound; insist only on what still matters. Rewrite `.ai/cezar/em/state/review.md` with
      what is still open, or the single line "No findings."
  - { id: done-task, type: check, name: Task approved, command: "bash .ai/cezar/em/mark-done.sh" }
  - { id: impl-ready, type: check, name: Open final PR, command: "bash .ai/cezar/em/impl-ready.sh" }

  # ---- plan reviewed by a human: a fresh planner revises it
  - id: replanner
    type: agent
    name: Planner revises
    prompt: |
      You are the PLANNER. A human reviewed the plan on this PR; the review is in
      `.ai/cezar/em/state/human-review.md`. The plan is the spec and the tasks this branch adds
      (`git diff --name-only origin/master...HEAD -- .ai/specs`). Follow `.ai/cezar/em/planner.md` and
      the repository rules in `.ai/cezar/em/rules.md`. Change the plan or explain why not, for each point, and write your answer per point to
      `.ai/cezar/em/state/answer.md`. Commit nothing.
      If the review or your changes affect how the views of the plan look or behave (including comments
      on the mockups), write the single line `redo` to `.ai/cezar/em/state/mockups`: a designer then
      reworks the mockups.
  - { id: pvalidate, type: check, name: Validate plan, command: "bash .ai/cezar/em/validate-plan.sh" }
  - { id: ploop, type: loop, name: Format fixes, max: 3 }
  - id: pfix
    type: agent
    name: Planner fixes format
    session: { continue: replanner }
    prompt: |
      `bash .ai/cezar/em/validate-plan.sh` found problems:

      {{nodes.pvalidate.output}}

      Fix the plan files.
  # the revised plan changes the UI: the designer reworks the prototype, new mockups go to the PR
  - { id: remock, type: check, name: "Mockups to redo?", command: "bash .ai/cezar/em/remock-check.sh" }
  - { id: needs-remock, type: if, name: "Redo mockups?", condition: { kind: output, ref: remock.output, op: contains, value: needed } }
  - { id: mock-restore, type: check, name: Restore prototype, command: "bash .ai/cezar/em/mock-restore.sh" }
  - id: designer
    type: agent
    name: Designer
    prompt: |
      You are the DESIGNER. A human reviewed the plan on this PR (`.ai/cezar/em/state/human-review.md`)
      and the planner revised it (`.ai/cezar/em/state/answer.md`). The plan is the spec and the tasks
      this branch adds (`git diff --name-only origin/master...HEAD -- .ai/specs`). The previous prototype:

      {{nodes.mock-restore.output}}

      Follow `.claude/skills/ui-mockups/SKILL.md` and `.ai/cezar/em/rules.md`: rework the prototype so it
      shows every view of the revised plan (the spec's `## UI` section), screenshot each new or changed
      one on the mock backend and leave the final PNGs and `captions.md` (say what changed since the last
      mockups) in `.ai/cezar/em/state/screens/`. Do not change the plan files. The prototype is kept on a
      side branch as the reference the developers reuse.
  - { id: mock-publish, type: check, name: Post mockups, command: "bash .ai/cezar/em/screens-publish.sh designer" }
  - { id: mloop, type: loop, name: Mockup retries, max: 2 }
  - id: designer-again
    type: agent
    name: Designer retries
    session: { continue: designer }
    prompt: |
      Publishing failed:

      {{nodes.mock-publish.output}}

      Leave the final screenshots in `.ai/cezar/em/state/screens/`.
  - { id: mock-save, type: check, name: Keep prototype on a branch, command: "bash .ai/cezar/em/mock-save.sh" }
  - id: mock-plan
    type: agent
    name: Planner points tasks at mockups
    session: { continue: replanner }
    prompt: |
      The designer reworked the prototype for your revised plan:

      {{nodes.mock-save.output}}

      If a prototype was kept, the developers should reuse it. Read it (`git fetch -q origin <branch>`,
      then `git diff HEAD origin/<branch>`) and make sure every task that builds one of these views has
      one up-to-date short bullet: "- Mockup: `<branch>` — <which files / widgets to reuse>", and the spec's
      `## UI` section names the branch. Change nothing else in the plan.
  - { id: validate-m, type: check, name: Validate plan, command: "bash .ai/cezar/em/validate-plan.sh" }
  - { id: vloop-m, type: loop, name: Format fixes, max: 3 }
  - id: mfix
    type: agent
    name: Planner fixes format
    session: { continue: replanner }
    prompt: |
      `bash .ai/cezar/em/validate-plan.sh` found problems:

      {{nodes.validate-m.output}}

      Fix the plan files.
  - { id: answered, type: check, name: Push + answer, command: "bash .ai/cezar/em/plan-answered.sh" }

  - { id: escalate, type: check, name: Escalate, command: "bash .ai/cezar/em/escalate.sh" }
  - { id: skipped, type: end, name: Nothing to do, status: success }
  - { id: done, type: end, status: success }
  - { id: stuck, type: end, status: failed }

edges:
  - { from: start, to: gate }
  - { from: gate.pass, to: is-resume }
  - { from: is-resume.true, to: tasks }
  - { from: is-resume.false, to: is-approve }
  - { from: is-approve.true, to: start-impl }
  - { from: is-approve.false, to: is-impl }
  - { from: is-impl.true, to: add-task }
  - { from: is-impl.false, to: is-plan }
  - { from: is-plan.true, to: replanner }
  - { from: is-plan.false, to: skipped }
  - { from: start-impl.pass, to: tasks }
  - { from: add-task.pass, to: tasks }

  - { from: tasks.repeat, to: next }
  - { from: tasks.exhausted, to: escalate }
  - { from: next.pass, to: no-task }
  - { from: no-task.true, to: impl-ready }
  - { from: no-task.false, to: implement }
  - { from: implement.done, to: tests }
  - { from: tests.pass, to: task-pr }
  - { from: task-pr.pass, to: ui-task }
  - { from: ui-task.pass, to: needs-shots }
  - { from: needs-shots.true, to: shoot }
  - { from: needs-shots.false, to: review }
  - { from: shoot.done, to: shots-publish }
  - { from: shots-publish.pass, to: review }
  - { from: shots-publish.fail, to: sloop }
  - { from: sloop.repeat, to: shoot-again }
  - { from: sloop.exhausted, to: escalate }
  - { from: shoot-again.done, to: shots-publish }
  - { from: tests.fail, to: fixes }
  - { from: fixes.repeat, to: fix }
  - { from: fixes.exhausted, to: escalate }
  - { from: fix.done, to: tests }
  - { from: review.approve, to: done-task }
  - { from: review.changes, to: post-review }
  - { from: post-review.pass, to: guard }
  - { from: guard.pass, to: rounds }
  - { from: guard.fail, to: escalate }
  - { from: rounds.repeat, to: address }
  - { from: rounds.exhausted, to: escalate }
  - { from: address.done, to: tests-a }
  - { from: tests-a.pass, to: post-reply }
  - { from: tests-a.fail, to: fixes-a }
  - { from: fixes-a.repeat, to: fix-a }
  - { from: fixes-a.exhausted, to: escalate }
  - { from: fix-a.done, to: tests-a }
  - { from: post-reply.pass, to: rereview }
  - { from: rereview.approve, to: done-task }
  - { from: rereview.changes, to: post-review }
  - { from: done-task.pass, to: tasks }
  - { from: impl-ready.pass, to: done }

  - { from: replanner.done, to: pvalidate }
  - { from: pvalidate.fail, to: ploop }
  - { from: ploop.repeat, to: pfix }
  - { from: ploop.exhausted, to: escalate }
  - { from: pfix.done, to: pvalidate }
  - { from: pvalidate.pass, to: remock }
  - { from: remock.pass, to: needs-remock }
  - { from: needs-remock.false, to: answered }
  - { from: needs-remock.true, to: mock-restore }
  - { from: mock-restore.pass, to: designer }
  - { from: designer.done, to: mock-publish }
  - { from: mock-publish.pass, to: mock-save }
  - { from: mock-publish.fail, to: mloop }
  - { from: mloop.repeat, to: designer-again }
  - { from: mloop.exhausted, to: escalate }
  - { from: designer-again.done, to: mock-publish }
  - { from: mock-save.pass, to: mock-plan }
  - { from: mock-plan.done, to: validate-m }
  - { from: validate-m.fail, to: vloop-m }
  - { from: vloop-m.repeat, to: mfix }
  - { from: vloop-m.exhausted, to: escalate }
  - { from: mfix.done, to: validate-m }
  - { from: validate-m.pass, to: answered }
  - { from: answered.pass, to: done }

  - { from: escalate.pass, to: stuck }
