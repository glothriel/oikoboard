name: oikoboard
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  crypto: ^3.0.8
  file_picker: ^13.4.1
  flutter:
    sdk: flutter
  flutter_blue_plus: ^2.3.15
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_riverpod: ^3.5.0
  flutter_timezone: ^5.1.1
  flutter_web_auth_2: ^5.1.0
  go_router: ^18.1.4
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  markdown: ^7.3.1
  material_ui: ^1.1.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  web: ^1.1.2
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  assets:
    - assets/logo_512.png
  uses-material-design: true

# `dart run flutter_launcher_icons` regenerates the app icons from assets/logo.png.
flutter_launcher_icons:
  image_path: assets/logo.png
  android: true
  ios: false
  min_sdk_android: 21
  adaptive_icon_background: "#03347F"
  adaptive_icon_foreground: assets/logo.png
  adaptive_icon_foreground_inset: 20
  web:
    generate: true
    image_path: assets/logo.png
    background_color: "#03347F"
    theme_color: "#03347F"
